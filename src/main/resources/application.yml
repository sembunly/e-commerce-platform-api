spring:
  application:
    name: fashion-ecom-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/fashion_ecom_db}
    username: ${MYSQL_USER:fashion_user}
    password: "${MYSQL_PASSWORD:0000}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: "${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:0000}}"
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-development-secret-change-me-32chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:fashion_admin}}
  secret-key: "${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:00000000}}"
  bucket: fashion-media
