spring:
  application:
    name: fashion-ecom-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/fashion_ecom_db}
    username: ${SPRING_DATASOURCE_USERNAME:fashion_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-development-secret-change-me-32chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: fashion-media
